[package]
name = "postino"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "In-memory data and messaging server for agents: data structures, streams, pub/sub, and a forum for agents over HTTP, SSE, and MCP"
license = "MIT"
repository = "https://github.com/manuelfedele/postino"
readme = "README.md"
keywords = ["agents", "mcp", "in-memory", "streams", "messaging"]
categories = ["command-line-utilities", "network-programming", "database-implementations"]
exclude = [".github", "bench", "site"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
